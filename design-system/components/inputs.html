<!-- @dsCard group="Components" name="Inputs & Forms" -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inputs &amp; Forms — EEC Website</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../preview.css">
<style>
    /* Copied from web-astro/src/styles/subpages.css (.form-grid / .field) */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .form-grid .full { grid-column: 1 / -1; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--ink-700); }
    .field label .req { color: #ef4444; margin-left: 2px; }
    .field input, .field select, .field textarea {
        font-family: inherit;
        padding: 12px 14px;
        border: 1.5px solid var(--border-strong);
        border-radius: var(--r-sm);
        font-size: 15px; color: var(--ink-900);
        background: var(--surface-card);
        transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
        outline: none;
        border-color: var(--green-700);
        box-shadow: 0 0 0 3px var(--green-100);
    }
    .field textarea { min-height: 100px; resize: vertical; }
    .field-err { font-size: 12px; color: #ef4444; }
    .is-invalid { border-color: #ef4444 !important; }
</style>
</head>
<body>
    <div class="ds-title">Inputs &amp; Forms</div>
    <div class="ds-sub">ช่องกรอกมุม r-sm 8px · focus ring เขียว green-100 หนา 3px · ฟิลด์บังคับมี * แดง</div>

    <div class="ds-frame">
        <div class="ds-frame-label">Form grid (ฟอร์มสมัครเรียน)</div>
        <div class="form-grid">
            <div class="field">
                <label>ชื่อ-นามสกุล<span class="req">*</span></label>
                <input type="text" placeholder="เช่น สมชาย ใจดี">
            </div>
            <div class="field">
                <label>เบอร์โทรศัพท์<span class="req">*</span></label>
                <input type="tel" placeholder="08x-xxx-xxxx">
            </div>
            <div class="field">
                <label>ระดับที่ต้องการสมัคร<span class="req">*</span></label>
                <select><option>ปวช. (จบ ม.3)</option><option>ปวส. (จบ ปวช./ม.6)</option></select>
            </div>
            <div class="field">
                <label>สาขาที่สนใจ</label>
                <select><option>ช่างยนต์</option><option>ช่างไฟฟ้ากำลัง</option><option>เทคโนโลยีสารสนเทศ</option></select>
            </div>
            <div class="field full">
                <label>ข้อความเพิ่มเติม</label>
                <textarea placeholder="คำถามหรือข้อมูลเพิ่มเติม"></textarea>
            </div>
            <div class="field">
                <label>อีเมล<span class="req">*</span></label>
                <input class="is-invalid" type="email" value="somchai@">
                <span class="field-err">รูปแบบอีเมลไม่ถูกต้อง</span>
            </div>
        </div>
    </div>
</body>
</html>
