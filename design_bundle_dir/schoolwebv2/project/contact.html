<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>ติดต่อเรา · วิทยาลัยเทคโนโลยีอีอีซี เอ็นจิเนีย แหลมฉบัง</title>
  <meta name="description" content="ติดต่อวิทยาลัยเทคโนโลยีอีอีซี เอ็นจิเนีย แหลมฉบัง · 75/2 หมู่ 10 ต.ทุ่งสุขลา อ.ศรีราชา จ.ชลบุรี 20230 · โทร 038-494-066, 095-070-6600"/>
  <meta name="keywords" content="ติดต่อ วิทยาลัยแหลมฉบัง, ที่อยู่ EEC Engineer, เบอร์โทร อาชีวศึกษา ศรีราชา"/>
  <link rel="icon" type="image/png" href="assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="homepage.css"/>
  <link rel="stylesheet" href="subpages.css"/>
  <link rel="stylesheet" href="mobile.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel">
    // ── Geo for the college (for map deep-links) ─────────────
    const GEO = { lat: 13.086485, lng: 100.936589 };
    const GEO_STR = `${GEO.lat},${GEO.lng}`;

    // ── Office-hours live status ─────────────────────────────
    // Mon-Fri 08:00-17:00, Sun 09:00-16:00, Sat closed
    function getOfficeStatus(now = new Date()) {
      const day = now.getDay(); // 0=Sun..6=Sat
      const mins = now.getHours() * 60 + now.getMinutes();
      const sched = { 0: [9*60, 16*60], 1: [8*60, 17*60], 2: [8*60, 17*60], 3: [8*60, 17*60], 4: [8*60, 17*60], 5: [8*60, 17*60], 6: null };
      const today = sched[day];
      const fmtDur = (m) => {
        const h = Math.floor(m / 60), mm = m % 60;
        if (h === 0) return `${mm} นาที`;
        if (mm === 0) return `${h} ชั่วโมง`;
        return `${h} ชม. ${mm} น.`;
      };
      // Find next opening
      const nextOpenLabel = () => {
        for (let i = 1; i <= 7; i++) {
          const d = (day + i) % 7;
          const s = sched[d];
          if (s) {
            const dayName = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'][d];
            const h = Math.floor(s[0]/60), mm = s[0]%60;
            const prefix = i === 1 ? 'พรุ่งนี้' : dayName;
            return `เปิด ${prefix} ${h}:${String(mm).padStart(2,'0')}`;
          }
        }
        return '';
      };
      if (!today) return { open: false, label: 'วันนี้ปิดทำการ', next: nextOpenLabel() };
      const [open, close] = today;
      if (mins < open) return { open: false, label: 'ยังไม่เปิดทำการ', next: `เปิดอีก ${fmtDur(open - mins)}` };
      if (mins >= close) return { open: false, label: 'ปิดทำการแล้ว', next: nextOpenLabel() };
      return { open: true, label: 'เปิดอยู่ตอนนี้', next: `ปิดอีก ${fmtDur(close - mins)}` };
    }

    function LiveStatus() {
      const [status, setStatus] = useState(() => getOfficeStatus());
      useEffect(() => {
        const id = setInterval(() => setStatus(getOfficeStatus()), 60_000);
        return () => clearInterval(id);
      }, []);
      return (
        <div className={`live-status ${status.open ? 'open' : 'closed'}`} role="status" aria-live="polite">
          <span className="dot" aria-hidden="true"/>
          <span>{status.label}</span>
          {status.next && <span className="next">{status.next}</span>}
        </div>
      );
    }

    // ── Toast context (light) ────────────────────────────────
    const ToastCtx = React.createContext(() => {});
    function ToastProvider({ children }) {
      const [msg, setMsg] = useState(null);
      const timer = useRef(null);
      const show = useCallback((text) => {
        setMsg(text);
        clearTimeout(timer.current);
        timer.current = setTimeout(() => setMsg(null), 1800);
      }, []);
      return (
        <ToastCtx.Provider value={show}>
          {children}
          <div className={`copy-toast ${msg ? 'show' : ''}`} aria-live="polite">
            {msg && <><Icon name="check"/>{msg}</>}
          </div>
        </ToastCtx.Provider>
      );
    }

    // ── Tap-to-copy button ───────────────────────────────────
    function Copyable({ value, label, copyText, children, href }) {
      const toast = React.useContext(ToastCtx);
      const [copied, setCopied] = useState(false);
      const onCopy = async (e) => {
        e.preventDefault();
        try {
          await navigator.clipboard.writeText(copyText ?? value);
          setCopied(true);
          toast(`คัดลอก${label}แล้ว`);
          setTimeout(() => setCopied(false), 1400);
        } catch {
          toast('คัดลอกไม่สำเร็จ');
        }
      };
      const onDoubleClick = (e) => { if (href) window.location.href = href; };
      return (
        <button
          type="button"
          className={`copyable ${copied ? 'copied' : ''}`}
          onClick={onCopy}
          onDoubleClick={onDoubleClick}
          aria-label={`คัดลอก${label}: ${value}`}
          title={href ? `กดเพื่อคัดลอก · ดับเบิลคลิกเพื่อเปิด` : 'กดเพื่อคัดลอก'}>
          {children ?? value}
          {copied
            ? <Icon name="check" className="copy-ic"/>
            : <svg viewBox="0 0 24 24" className="copy-ic" aria-hidden="true"><path d="M8 4h10a2 2 0 012 2v10M16 8H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-10a2 2 0 00-2-2z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" fill="none"/></svg>
          }
        </button>
      );
    }

    // ── Save-to-Contacts (vCard download) ────────────────────
    function VCardCTA() {
      const toast = React.useContext(ToastCtx);
      const onClick = () => {
        const vcf = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'FN:วิทยาลัยเทคโนโลยีอีอีซี เอ็นจิเนีย แหลมฉบัง',
          'ORG:วิทยาลัยเทคโนโลยีอีอีซี เอ็นจิเนีย แหลมฉบัง',
          'TEL;TYPE=WORK,VOICE:+6638494066',
          'TEL;TYPE=WORK,VOICE:+6638494064',
          'TEL;TYPE=CELL,VOICE:+66950706600',
          'EMAIL;TYPE=WORK:technologylaemchabang@gmail.com',
          'ADR;TYPE=WORK:;;75/2 หมู่ 10 ต.ทุ่งสุขลา;อ.ศรีราชา;ชลบุรี;20230;ประเทศไทย',
          `GEO:${GEO.lat};${GEO.lng}`,
          'URL:https://www.facebook.com/eec.engineer.laemchabang',
          'END:VCARD',
        ].join('\r\n');
        const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'EEC-Engineer-Laemchabang.vcf';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 100);
        toast('บันทึกผู้ติดต่อแล้ว');
      };
      return (
        <div className="vcard-card">
          <div className="vcard-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 4h14a2 2 0 012 2v14a2 2 0 01-2 2H4V4z" stroke="currentColor" strokeWidth="2" fill="none" strokeLinejoin="round"/><circle cx="11" cy="11" r="3" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M6 18c1-2 3-3 5-3s4 1 5 3" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round"/></svg>
          </div>
          <div className="vcard-text">
            <strong>เพิ่มเข้าสมุดโทรศัพท์</strong>
            <span>ดาวน์โหลด vCard เก็บข้อมูลติดต่อทั้งหมดในคลิกเดียว</span>
          </div>
          <button className="vcard-btn" onClick={onClick} type="button">
            <Icon name="arrowDown" style={{ width: 14, height: 14 }}/>
            บันทึก .vcf
          </button>
        </div>
      );
    }

    // ── Map + directions quick-bar ───────────────────────────
    function ContactMap() {
      const dirs = [
        { label: 'Google Maps', sub: 'นำทาง', href: `https://www.google.com/maps/dir/?api=1&destination=${GEO_STR}`,
          icon: <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" fill="none"/></svg> },
        { label: 'Apple Maps', sub: 'iPhone', href: `https://maps.apple.com/?daddr=${GEO_STR}&dirflg=d`,
          icon: <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" stroke="currentColor" strokeWidth="2" fill="none"/><circle cx="12" cy="10" r="3" stroke="currentColor" strokeWidth="2" fill="none"/></svg> },
        { label: 'แชร์ตำแหน่ง', sub: 'ส่งให้เพื่อน',
          icon: <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3" stroke="currentColor" strokeWidth="2" fill="none"/><circle cx="6" cy="12" r="3" stroke="currentColor" strokeWidth="2" fill="none"/><circle cx="18" cy="19" r="3" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" strokeWidth="2"/></svg>,
          onClick: async (toast) => {
            const url = `https://www.google.com/maps?q=${GEO_STR}`;
            const data = { title: 'วิทยาลัยเทคโนโลยีอีอีซี เอ็นจิเนีย แหลมฉบัง', text: '75/2 หมู่ 10 ต.ทุ่งสุขลา อ.ศรีราชา จ.ชลบุรี 20230', url };
            try {
              if (navigator.share) await navigator.share(data);
              else { await navigator.clipboard.writeText(url); toast('คัดลอกลิงก์แผนที่แล้ว'); }
            } catch {}
          }
        },
      ];
      const toast = React.useContext(ToastCtx);
      return (
        <div className="contact-map">
          <iframe
            title="แผนที่วิทยาลัย"
            src={`https://www.google.com/maps?q=${GEO_STR}&hl=th&z=16&output=embed`}
            loading="lazy"
            referrerPolicy="no-referrer-when-downgrade"
            allowFullScreen
          />
          <div className="directions-bar">
            {dirs.map((d, i) => {
              const inner = <>{d.icon}<span>{d.label}</span><small>{d.sub}</small></>;
              return d.onClick
                ? <button key={i} className="dir-btn" type="button" onClick={() => d.onClick(toast)}>{inner}</button>
                : <a key={i} className="dir-btn" href={d.href} target="_blank" rel="noopener noreferrer">{inner}</a>;
            })}
          </div>
        </div>
      );
    }

    function ContactApp() {
      useReveal();
      return (
        <>
          <Nav active="contact"/>
          <main>
            <section className="page-hero">
              <div className="container page-hero-inner">
                <div className="crumbs">
                  <a href="index.html">หน้าแรก</a>
                  <Icon name="chevronRight" style={{ width: 12, height: 12 }}/>
                  <span>ติดต่อเรา</span>
                </div>
                <span className="eyebrow">เรายินดีต้อนรับ</span>
                <h1>ติดต่อ<span className="grad">วิทยาลัย</span> หรือเยี่ยมชมได้ทุกวัน</h1>
                <p>ฝ่ายงานธุรการพร้อมตอบทุกคำถาม ทั้งทางโทรศัพท์ อีเมล หรือเข้าพบที่วิทยาลัยโดยตรง</p>
                <div style={{ marginTop: 20 }}><LiveStatus/></div>
              </div>
            </section>

            <section className="section">
              <div className="container">
                <div className="contact-grid">
                  <Reveal dir="left" className="contact-info">
                    <div className="contact-row">
                      <div className="icon"><Icon name="pin" style={{ width: 22, height: 22 }}/></div>
                      <div>
                        <h3>ที่อยู่</h3>
                        <Copyable
                          value="75/2 หมู่ 10 ต.ทุ่งสุขลา อ.ศรีราชา จ.ชลบุรี 20230"
                          label="ที่อยู่">
                          75/2 หมู่ 10 ต.ทุ่งสุขลา<br/>อ.ศรีราชา จ.ชลบุรี 20230
                        </Copyable>
                      </div>
                    </div>
                    <div className="contact-row">
                      <div className="icon"><Icon name="phone" style={{ width: 22, height: 22 }}/></div>
                      <div>
                        <h3>โทรศัพท์</h3>
                        <Copyable value="038-494-066" copyText="0384940 66" label="เบอร์โทร" href="tel:038494066"/>
                        <br/>
                        <Copyable value="038-494-064" copyText="0384940 64" label="เบอร์โทร" href="tel:038494064"/>
                        <br/>
                        <Copyable value="095-070-6600" copyText="0950706600" label="เบอร์โทร" href="tel:0950706600"/>
                      </div>
                    </div>
                    <div className="contact-row">
                      <div className="icon"><Icon name="mail" style={{ width: 22, height: 22 }}/></div>
                      <div>
                        <h3>อีเมล</h3>
                        <Copyable value="technologylaemchabang@gmail.com" label="อีเมล" href="mailto:technologylaemchabang@gmail.com"/>
                      </div>
                    </div>
                    <div className="contact-row">
                      <div className="icon" style={{ background: '#1c2a4e15', color: '#1c2a4e' }}><Icon name="users" style={{ width: 22, height: 22 }}/></div>
                      <div>
                        <h3>เวลาทำการ</h3>
                        <p style={{ fontWeight: 500, fontSize: 14, color: 'var(--ink-700)' }}>
                          จันทร์ - ศุกร์: <strong>8:00 - 17:00 น.</strong><br/>
                          อาทิตย์: <strong>9:00 - 16:00 น.</strong><br/>
                          เสาร์: ปิดทำการ
                        </p>
                      </div>
                    </div>
                    <div className="contact-row">
                      <div className="icon" style={{ background: '#1877f215', color: '#1877f2' }}><Icon name="facebook" style={{ width: 22, height: 22 }}/></div>
                      <div>
                        <h3>โซเชียลมีเดีย</h3>
                        <a href="https://www.facebook.com/eec.engineer.laemchabang" target="_blank" rel="noopener">facebook.com/eec.engineer.laemchabang</a>
                      </div>
                    </div>
                  </Reveal>
                  <Reveal dir="right">
                    <ContactMap/>
                  </Reveal>
                </div>
              </div>
            </section>

            <section className="section section-sm" style={{ background: 'var(--bg-alt)', paddingTop: 64, paddingBottom: 64 }}>
              <div className="container">
                <Reveal className="section-head" style={{ textAlign: 'center', margin: '0 auto 32px' }}>
                  <span className="eyebrow">ฝ่ายงานต่างๆ</span>
                  <h2 className="section-title">ติดต่อตรงตามฝ่าย</h2>
                </Reveal>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 16 }}>
                  {[
                    { t: 'งานธุรการ', s: 'รับสมัครเรียน เอกสาร', tel: '038-494-066', icon: 'briefcase' },
                    { t: 'งานวิชาการ', s: 'หลักสูตร ตารางเรียน', tel: '038-494-066 ต่อ 2', icon: 'book' },
                    { t: 'งานการเงิน', s: 'ค่าเทอม กยศ.', tel: '038-494-066 ต่อ 3', icon: 'chart' },
                    { t: 'งานกิจการนักเรียน', s: 'กิจกรรม วินัย ทุน', tel: '038-494-066 ต่อ 4', icon: 'users' },
                  ].map((d, i) => (
                    <Reveal key={i} delay={i * 0.06} className="contact-row" style={{ background: 'white' }}>
                      <div className="icon"><Icon name={d.icon} style={{ width: 22, height: 22 }}/></div>
                      <div>
                        <h3>{d.t}</h3>
                        <p style={{ fontSize: 13, color: 'var(--ink-500)', fontWeight: 500, marginBottom: 4 }}>{d.s}</p>
                        <Copyable value={d.tel} copyText={d.tel.replace(/[^0-9]/g, '')} label="เบอร์โทร" href={`tel:${d.tel.replace(/[^0-9]/g, '')}`}/>
                      </div>
                    </Reveal>
                  ))}
                </div>
              </div>
            </section>
          </main>
          <Footer/>
          <StickyCTA/>
        </>
      );
    }

    function App() {
      return <ToastProvider><ContactApp/></ToastProvider>;
    }

    const mount = () => {
      if (!window.Nav) return setTimeout(mount, 50);
      ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
    };
    mount();
  </script>
</body>
</html>
