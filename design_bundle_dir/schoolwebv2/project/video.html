<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ทัวร์ 1 นาที · วิทยาลัยเทคโนโลยีอีอีซี เอ็นจิเนีย แหลมฉบัง</title>
  <meta name="description" content="วิดีโอแนะนำวิทยาลัยเทคโนโลยีอีอีซี เอ็นจิเนีย แหลมฉบัง 60 วินาที — รู้จักหลักสูตร พันธมิตร EEC และผลงานของเรา"/>
  <link rel="icon" type="image/png" href="assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="homepage.css"/>
  <link rel="stylesheet" href="subpages.css"/>
  <link rel="stylesheet" href="mobile.css"/>
  <style>
    body { background: #0a0a0a; }
    .video-shell {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
    }
    .video-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      color: white;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .video-bar a { color: white; text-decoration: none; font-size: 14px; }
    .video-bar .brand { display: flex; align-items: center; gap: 12px; }
    .video-bar .brand img { width: 36px; height: 36px; }
    .video-bar .brand .name { font-weight: 600; font-size: 14px; }
    .video-bar .brand .tag { font-size: 11px; color: rgba(255,255,255,0.6); }
    .video-bar .back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      font-weight: 500;
    }
    .video-bar .back:hover { background: rgba(255,255,255,0.16); }
    .stage-host { position: relative; flex: 1; min-height: 0; }
    .stage-host > div { position: absolute !important; inset: 0 !important; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="video-shell" data-video-root data-screen-label="t=0s">
    <header class="video-bar">
      <div class="brand">
        <img src="assets/logo.png" alt=""/>
        <div>
          <div class="name">วิทยาลัยเทคโนโลยีอีอีซี เอ็นจิเนีย แหลมฉบัง</div>
          <div class="tag">ทัวร์วิทยาลัย · 1 นาที · กด ⎵ เพื่อหยุด/เล่น</div>
        </div>
      </div>
      <a href="index.html" class="back">← กลับสู่เว็บไซต์</a>
    </header>
    <div id="stage-host" class="stage-host"></div>
  </div>

  <script type="text/babel" src="animations.jsx"></script>
  <script type="text/babel" src="video-illustrations.jsx"></script>
  <script type="text/babel" src="video-scenes.jsx"></script>
  <script type="text/babel">
    function VideoApp() {
      return (
        <Stage width={1920} height={1080} duration={60} loop background="#0b1a13" persistKey="eec-tour">
          {/* Solid background gradient layer */}
          <svg viewBox="0 0 1920 1080" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
            <defs>
              <radialGradient id="bgRoot" cx="0.5" cy="0.5" r="0.8">
                <stop offset="0" stopColor="#0f6634"/>
                <stop offset="0.5" stopColor="#0a4d28"/>
                <stop offset="1" stopColor="#04190d"/>
              </radialGradient>
            </defs>
            <rect x="0" y="0" width="1920" height="1080" fill="url(#bgRoot)"/>
            <Scene1_Title/>
            <Scene2_Geo/>
            <Scene3_Trades/>
            <Scene4_Partners/>
            <Scene5_Stats/>
            <Scene6_Philosophy/>
            <Scene7_CTA/>
          </svg>
          <SceneMarkers/>
        </Stage>
      );
    }

    const mount = () => {
      if (!window.Stage || !window.Scene1_Title) return setTimeout(mount, 80);
      ReactDOM.createRoot(document.getElementById('stage-host')).render(<VideoApp/>);
    };
    mount();
  </script>
</body>
</html>
