  <!-- Transparent runtime resolver: rewrites any <img src="assets/..."> to its inlined blob URL.
       Keeps shared JSX files untouched so other pages are unaffected. -->
  <script>
  (function () {
    function buildMap() {
      var map = {};
      var metas = document.querySelectorAll('meta[name="ext-resource-dependency"]');
      for (var i = 0; i < metas.length; i++) {
        var path = metas[i].getAttribute('content');
        var id = metas[i].getAttribute('data-resource-id');
        if (window.__resources && window.__resources[id]) map[path] = window.__resources[id];
      }
      return map;
    }
    function sweep() {
      var map = buildMap();
      if (!Object.keys(map).length) return;
      var imgs = document.querySelectorAll('img');
      for (var i = 0; i < imgs.length; i++) {
        var raw = imgs[i].getAttribute('src');
        if (raw && map[raw]) imgs[i].src = map[raw];
      }
    }
    function start() {
      var mo = new MutationObserver(sweep);
      mo.observe(document.documentElement, { childList: true, subtree: true });
      var iv = setInterval(sweep, 120);
      setTimeout(function () { clearInterval(iv); }, 12000);
      sweep();
    }
    if (document.readyState !== 'loading') start();
    else document.addEventListener('DOMContentLoaded', start);
  })();
  </script>
